server:
  port: 8080

spring:
  application:
    name: product-agent

  datasource:
    url: jdbc:mysql://localhost:4001/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: agent_user
    password: agent_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  ai:
    google:
      genai:
        api-key: ${GCP_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2
            max-output-tokens: 2048