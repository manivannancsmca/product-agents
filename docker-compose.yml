version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: product_agent_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: product_db
      MYSQL_USER: agent_user
      MYSQL_PASSWORD: agent_password
    ports:
      - "4001:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: